# Three-container stack for vxtpl: vxtpl-app (Next.js) + vxtpl-redis (RP session
# store) + vxtpl-db (business data). PROJECT_NAME drives the compose project +
# container-name prefix, so a second stack on the same host never collides.
# Backing services are internal-only; only the app publishes a port.
#
# ONE NUMBER, AND ONE VARIABLE. Registry rule R3 makes three things equal - the
# dev port, the in-code fallback default, and the port the app listens on INSIDE
# the container. It deliberately does NOT include the published host port, which
# stays a variable: that is what lets a prod and a beta stack of the same product
# share a host (arda publishes 3230 and 3231 into two containers that both listen
# on 3230). The number is allocated by the port registry, the only source that
# may assign one.
#
# The container side is a LITERAL on purpose. Making it a variable too - which
# this file briefly did - means the port the app listens on depends on an env
# value reaching every consumer of it, and on 2026-08-17 one consumer did not get
# it: deploy.sh probed the default while the container listened on the operator's
# value, and reported a health failure against a container Docker had already
# marked healthy. A literal cannot drift. Every other product on the deploy host
# (atlas 3100, runos 3120, arda 3230) is written this way.
name: ${PROJECT_NAME:-vxtpl}

services:
  app:
    container_name: ${PROJECT_NAME:-vxtpl}-app
    build:
      context: .
      dockerfile: portals/app/Dockerfile
      # Local `compose build` only; the deploy path pulls the CI-built image (which
      # injects real provenance). Honest dev/unknown defaults for local builds.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        DEPLOY_STAGE: ${DEPLOY_STAGE:-dev}
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/${PRODUCT_CODE:-vxtpl}-app:${IMAGE_TAG:-local}
    # Load the full operator .env into the app so ALL runtime config (OIDC,
    # platform client, webhook, INTERNAL_JOB_TOKEN, STATUS_PAGE, ...) reaches it -
    # not just the few keys in `environment:` below. APP_ENV_FILE is the absolute
    # path deploy.sh passes (<root>/etc/.env); local dev falls back to ./.env.
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://${PROJECT_NAME:-vxtpl}-redis:6379
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${APP_PUBLISH_PORT:-4000}:4000"
    depends_on:
      - redis
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [appnet]
    restart: unless-stopped

  redis:
    container_name: ${PROJECT_NAME:-vxtpl}-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks: [appnet]
    restart: unless-stopped

  db:
    container_name: ${PROJECT_NAME:-vxtpl}-db
    image: postgres:16-alpine
    environment:
      # The container superuser is the DB OWNER, NOT the service role. The DDL
      # (db-init, as this owner) creates the least-privilege vxtpl_svc role that
      # the app connects as via DATABASE_URL (product_240 section 2.7: connect
      # identity = vxtpl_svc, never owner-direct).
      POSTGRES_DB: ${POSTGRES_DB:-vxturebiz_${PRODUCT_CODE_SNAKE:-vxtpl}_prod}
      POSTGRES_USER: ${POSTGRES_DB_OWNER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
    name: ${PROJECT_NAME:-vxtpl}-net

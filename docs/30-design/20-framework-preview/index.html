.management-activity .meta,.management-activity .when{font-size:12px;color:var(--muted)}
.management-activity .when{margin-inline-start:auto;white-space:nowrap}
.management-settings{display:grid;gap:16px;max-width:640px;padding-block-start:16px;border-block-start:1px solid var(--management-hairline)}
.management-settings .btn{justify-self:start}
@container(max-width:580px){
 .management-heading{gap:12px;margin-block-start:16px;padding-block-end:20px}
 .management-toolbar .search-field{width:auto;flex:1 1 138px}
 .management-section{padding-block-start:20px}
}

/* Map chrome overlays the stage, leaving all bottom space to the product. */
.map-header,.canvas-workspace{
 --map-foreground:#e8eef3;--map-muted:#9baeb9;--map-surface:#111d24;--map-border:#2e434f;--map-accent:#a8d7d1;
 color:var(--map-foreground)
}
.map-header{
 --map-header-inset:clamp(12px,2cqw,32px);position:relative;z-index:23;display:flex;justify-content:space-between;align-items:center;
 --map-hover:#ffffff14;--map-active:#a8d7d125;
 gap:12px;flex:none;height:var(--spacing-header-md);min-height:var(--spacing-header-md);
 padding-inline:var(--map-header-inset);background:linear-gradient(180deg,#0a1218f5,#0b141add);
 border:0;box-shadow:inset 0 -1px #ffffff12
}
.product-app>.map-header{margin-block-end:calc(-1 * var(--spacing-header-md))}
.map-header-left,.map-header-right,.map-header-meta,.map-identity{display:flex;align-items:center;gap:12px;min-width:0}
.map-header-left{flex:1;gap:16px}
.map-header-right{flex:none}
.map-identity{flex:0 1 auto}
.map-identity .brand{gap:10px;min-width:0}
.map-identity .brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:none;color:var(--map-foreground);font-size:17px;font-weight:650;line-height:24px}
.map-identity .brand-symbol{flex:none;width:var(--space-control-md);height:var(--space-control-md);color:var(--map-accent)}
.map-brand-meta{
 display:grid;align-content:center;min-width:0;height:var(--space-control-md);padding-inline-start:10px;
 position:relative;color:var(--map-muted);font-size:10px;line-height:12px;white-space:nowrap
}
.map-brand-meta::before{content:"";position:absolute;inset:6px auto 6px 0;border-inline-start:1px solid var(--map-border)}
.map-brand-meta strong{overflow:hidden;text-overflow:ellipsis;color:#c7dfde;font:500 11px/14px "Geist Mono",monospace;letter-spacing:.06em}
.map-header-control{
 display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;height:var(--space-control-md);min-width:var(--space-control-md);
 padding:0 8px;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--map-foreground)
}
.map-view-picker{background:var(--map-hover);border-color:#ffffff1c}
.map-header-control .ds-icon,.map-header .icon-btn{color:var(--map-muted)}
.map-header .header-ai-entry{--ai-halo-color:var(--map-accent)}
.map-header .shell-icon-group:not([data-header-group="G2"]):is(:hover,:focus-within){background:var(--map-hover)}
.map-header :is(.map-header-control,.icon-btn):not(.header-ai-entry):is(:hover,:focus-visible,[aria-pressed="true"],[aria-expanded="true"]){
 background:var(--map-active);color:var(--map-foreground)
}
.map-header :is(.map-header-control,.icon-btn):not(.header-ai-entry):focus-visible{outline:2px solid var(--map-accent);outline-offset:1px}
.map-view-info{background:#a8d7d116;border-color:#a8d7d13d;color:#d3eee9}
.map-view-info .ds-icon{color:currentColor}
.map-header .header-groups{margin:0}
.map-header-meta{height:var(--space-control-md)}
.map-header-date,.map-header-state{display:inline-flex;align-items:center;height:var(--space-control-md);white-space:nowrap}
.map-header-date{font:11px "Geist Mono",monospace;color:var(--map-muted)}
.map-header-state{
 color:#dcc49b;font-size:10px
}
.map-header-state>span{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid #af93614d;border-radius:4px;background:#b9945314}
.map-header-state>span::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.canvas-workspace{background:#0d161d}
.canvas-stage{
 inset:0;padding-top:var(--spacing-header-md,48px);
 background:radial-gradient(ellipse at 50% 54%,#1b303a70,transparent 62%),radial-gradient(#40546270 1px,transparent 1px) 0 0/24px 24px,#0d161d
}
.canvas-workspace .stage-empty :is(p,.eyebrow){color:var(--map-muted)}
.canvas-workspace .stage-emblem{color:var(--map-accent)}
.canvas-workspace .canvas-panel{left:16px;top:calc(var(--spacing-header-md,48px) + 18px)}
.canvas-workspace .canvas-panel.right{left:auto;right:16px}
.canvas-workspace .canvas-panel{
 --card:#142129;--border:#304653;--muted:#adbdc8;--foreground:#e8eef3;--soft:#263c46;--primary-text:#a8d7d1;
 color:var(--foreground);max-height:calc(100% - var(--spacing-header-md,48px) - 34px)
}
.product-app.focus-mode .canvas-stage{padding-top:0}
.product-app[data-frame="canvas"]:not(.focus-mode) .assistant-dock{margin-block-start:var(--spacing-header-md)}
.canvas-workspace .focus-return{background:var(--map-surface);color:var(--map-foreground);border-color:var(--map-border)}
@container(max-width:850px){.map-header-date{display:none}}
@container(max-width:680px){
 .map-header-meta,.map-header .header-primary-actions{display:none}
 .map-header .header-more{display:inline-flex}
}
@container(max-width:560px){
 .map-header,.map-header-left,.map-header-right{gap:7px}
 .map-brand-meta,.map-view-info span,.map-view-picker-label,.map-view-picker .ds-icon:last-child{display:none}
 .map-identity .brand{gap:6px}
 .map-identity .brand-name{font-size:15px}
 .map-header .header-groups{gap:5px}
 .map-header .shell-icon-group{gap:3px}
 .map-header-control{width:var(--space-control-md);padding:0}
 .canvas-workspace .stage-empty{padding-inline:44px}
}
.page-width-picker{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.page-width-picker select{min-height:28px;padding-inline:7px;font-variant-numeric:tabular-nums}
#viewport-size{white-space:nowrap;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.work-card{transition:none}}
</style>

// Native popovers provide light-dismiss and Escape without rebuilding content.
let shellPanelCounter=0;
function closeShellPanels(restoreFocus=false){
 let anchor;
 for(const panel of [...app.querySelectorAll('.shell-popover')].reverse()){
  anchor=panel._anchor||anchor;
  if(panel.matches(':popover-open'))panel.hidePopover();
  panel.remove();
 }
 if(restoreFocus)anchor?.focus();
}
function positionShellPanel(panel,anchor,nested=false){
 const rect=anchor.getBoundingClientRect(),width=Math.min(320,innerWidth-24);
 panel.style.width=width+'px';panel.style.maxHeight=(innerHeight-24)+'px';
 const height=panel.getBoundingClientRect().height;
 let left=rect.left,top=rect.bottom+8;
 if(nested&&innerWidth>1024){left=rect.right+8;top=rect.bottom-height;if(left+width>innerWidth-12)left=rect.left-width-8;}
 else if(top+height>innerHeight-12&&rect.top-height-8>=12)top=rect.top-height-8;
 left=Math.max(12,Math.min(left,innerWidth-width-12));top=Math.max(12,Math.min(top,innerHeight-height-12));
 panel.style.left=left+'px';panel.style.top=top+'px';
}
function showShellPanel(anchor,title,body,nested=false){
 const current=app.querySelector('.shell-popover:popover-open');
 if(!nested&&current?._anchor===anchor){closeShellPanels(true);return;}
 if(!nested)closeShellPanels();
 const panel=document.createElement('div');
 panel.id='shell-panel-'+(++shellPanelCounter);panel.className='shell-popover';panel.setAttribute('popover','auto');panel.setAttribute('role','dialog');panel.setAttribute('aria-label',title);panel.dataset.component='ShellPanelContent';panel._anchor=anchor;panel.innerHTML=body;
 (nested?anchor.closest('.shell-popover'):app).append(panel);
 anchor.setAttribute('aria-expanded','true');anchor.setAttribute('aria-controls',panel.id);
 panel.addEventListener('toggle',event=>{if(event.newState==='closed'){anchor.setAttribute('aria-expanded','false');anchor.removeAttribute('aria-controls');}});
 panel.showPopover();positionShellPanel(panel,anchor,nested);
 return panel;
}
function scopeRow(label,description,action,glyph,extra=''){
 return `<button class="scope-panel-row" data-action="${action}" ${extra}>${dsIcon(glyph)}<span><strong>${label}</strong>${description?`<small>${description}</small>`:''}</span>${dsIcon('chevron-right')}</button>`;
}
function scopeResource(label,glyph,amount,unit,used,percent){return `<div class="scope-resource">${dsIcon(glyph)}<div class="scope-resource-label"><strong>${label}</strong><small>workspace</small></div><div class="scope-resource-value" tabindex="0" title="\u603b\u914d\u989d ${amount} ${unit}\uff1b\u5df2\u4f7f\u7528 ${used} \u00b7 ${percent}%"><div><strong>${amount}</strong> ${unit}</div><progress value="${percent}" max="100" aria-label="${label}\u5df2\u4f7f\u7528 ${percent}%"></progress></div></div>`;}

 return panel;
}
function showScopePicker(anchor){

}

const assistantState={open:false,wide:false,menu:null,active:0,conversations:[{messages:[],draft:''}]};
const assistantTitle='AI \u52a9\u624b';
const sampleReply='\u5148\u628a\u60f3\u8981\u7684\u7ed3\u679c\u5199\u6210\u4e00\u53e5\u8bdd\uff0c\u518d\u5206\u6210\u4e09\u6b65\uff1a\n\n1. \u5217\u51fa\u5df2\u6709\u8d44\u6599\u548c\u8fd8\u9700\u786e\u8ba4\u7684\u4e8b\u9879\n2. \u4e3a\u6bcf\u4ef6\u4e8b\u5b9a\u4e00\u4e2a\u8d1f\u8d23\u4eba\u548c\u4ea4\u4ed8\u65f6\u95f4\n3. \u5148\u5b8c\u6210\u4e00\u4ef6\u80fd\u89e3\u9501\u540e\u7eed\u5de5\u4f5c\u7684\u4e8b';
function activeConversation(){return assistantState.conversations[assistantState.active];}
function assistantMark(){return `<span class="assistant-mark" aria-hidden="true">${dsIcon('sparkle')}</span>`;}
function chatMessage(message){
 return `<div class="chat-message ${message.role}">${escapeHtml(message.text)}</div>`;
}
function assistantLog(){
 const {messages}=activeConversation();
 if(messages.length)return messages.map(chatMessage).join('');
 return `<div class="assistant-dock-empty">${assistantMark()}<h3>\u6211\u4eec\u4ece\u54ea\u4ef6\u4e8b\u5f00\u59cb\uff1f</h3><p>\u8bf4\u8bf4\u4f60\u60f3\u63a8\u8fdb\u7684\u5de5\u4f5c\uff0c\u4e00\u8d77\u7406\u6e05\u4e0b\u4e00\u6b65\u3002</p></div>`;
}
function assistantDock(){
 return `<aside class="assistant-dock" id="assistant-dock" aria-labelledby="assistant-dock-title" hidden>
  <header class="assistant-dock-header">
   <h2 class="assistant-dock-title" id="assistant-dock-title">${assistantMark()}${assistantTitle}</h2>
   <div class="assistant-dock-actions" role="group" aria-label="\u5bf9\u8bdd\u64cd\u4f5c">
    ${shellTool('\u5207\u6362\u5bbd\u7a84\u6a21\u5f0f','assistant-width','arrows-out-line-horizontal','','aria-pressed="false"')}
    ${shellTool('\u65b0\u5bf9\u8bdd','assistant-new','plus')}
    ${shellTool('\u5168\u90e8\u5bf9\u8bdd','assistant-history','list','','aria-controls="assistant-dock-menu" aria-expanded="false"')}
    ${shellTool('\u66f4\u591a\u64cd\u4f5c','assistant-more','more','','aria-controls="assistant-dock-menu" aria-expanded="false"')}
    ${shellTool('\u5173\u95ed AI \u52a9\u624b','assistant-close','close')}
   </div>
  </header>
  <div class="assistant-dock-context">${dsIcon('folder')}<span>${escapeHtml(scopePreview.workspace)}</span></div>
  <div class="assistant-dock-menu" id="assistant-dock-menu" hidden></div>
  <div class="assistant-dock-log" role="log" tabindex="0" aria-label="\u5bf9\u8bdd\u8bb0\u5f55">${assistantLog()}</div>
  <form class="assistant-composer" id="assistant-dock-form">
   <label class="sr-only" for="assistant-dock-input">\u8f93\u5165\u6d88\u606f</label>
   <textarea id="assistant-dock-input" aria-describedby="assistant-dock-keys" maxlength="500" placeholder="\u63a5\u4e0b\u6765\u60f3\u505a\u4ec0\u4e48\uff1f">${escapeHtml(activeConversation().draft)}</textarea>
   <div class="row"><small id="assistant-dock-keys"><kbd>Enter</kbd> \u53d1\u9001 \u00b7 <kbd>Shift+Enter</kbd> \u6362\u884c</small><button class="icon-btn" type="submit" aria-keyshortcuts="Enter Control+Enter Meta+Enter" aria-label="\u53d1\u9001\u793a\u4f8b\u6d88\u606f" ${activeConversation().draft.trim()?'':'disabled'}>${dsIcon('arrow-up')}</button></div>
  </form>
 </aside>`;
}
function applyAssistantDock(){
 const dock=document.getElementById('assistant-dock');
 if(!dock)return;
 const open=assistantState.open;
 const drawer=open&&app.clientWidth<=1100;
 const previousDrawer=dock.hasAttribute('data-drawer');
 dock.hidden=!open;
 dock.dataset.width=assistantState.wide?'wide':'narrow';
 const widthControl=dock.querySelector('[data-action="assistant-width"]');
 widthControl.setAttribute('aria-pressed',String(assistantState.wide));
 widthControl.innerHTML=dsIcon(assistantState.wide?'arrows-in-line-horizontal':'arrows-out-line-horizontal');
 dock.toggleAttribute('data-drawer',drawer);
 if(drawer){dock.setAttribute('role','dialog');dock.setAttribute('aria-modal','true');}
 else{dock.removeAttribute('role');dock.removeAttribute('aria-modal');}
 document.getElementById('page-content').inert=drawer;
 document.getElementById('assistant-dock-backdrop').hidden=!drawer;
 app.querySelectorAll('[data-action="header-ai"]').forEach(button=>button.setAttribute('aria-expanded',String(open)));
 document.querySelector('.inspector [data-action="header-ai"]')?.setAttribute('aria-expanded',String(open));
 if(drawer&&!previousDrawer&&!dock.contains(document.activeElement))dock.querySelector('textarea').focus();
}
function toggleAssistantDock(trigger,open=!assistantState.open){
 if(!document.getElementById('assistant-dock'))return;
 if(open)assistantState.trigger=trigger;
 setAssistantMenu();
 assistantState.open=open;
 closeShellPanels();
 applyPanels();
 applyAssistantDock();
 if(open){
  const log=document.querySelector('.assistant-dock-log');
  log.scrollTop=log.scrollHeight;
  document.getElementById('assistant-dock-input').focus();
 }else{
  const previous=assistantState.trigger;
  (previous?.isConnected?previous:app.querySelector('[data-action="header-ai"]'))?.focus();
 }
}
function setAssistantMenu(menu=null,restoreFocus=false){
 const panel=document.getElementById('assistant-dock-menu');
 if(!panel)return;
 const previous=assistantState.menu;
 assistantState.menu=menu;
 const dock=panel.closest('.assistant-dock');
 for(const action of ['history','more']){
  dock.querySelector(`[data-action="assistant-${action}"]`).setAttribute('aria-expanded',String(menu===action));
 }
 panel.hidden=!menu;
 if(menu==='history'){
  panel.innerHTML='<div class="assistant-dock-menu-title">\u5168\u90e8\u5bf9\u8bdd</div>'+assistantState.conversations.map((conversation,index)=>{
   const label=conversation.messages[0]?.text||'\u65b0\u5bf9\u8bdd';
   const selected=index===assistantState.active?'aria-current="true"':'';
   return `<button class="tree-item" data-action="assistant-select" data-conversation="${index}" ${selected}>${dsIcon('file-text')}<span>${escapeHtml(label)}</span></button>`;
  }).reverse().join('');
 }else if(menu==='more'){
  panel.innerHTML='<div class="assistant-dock-menu-title">\u66f4\u591a\u64cd\u4f5c</div>'+button('\u590d\u5236\u6700\u8fd1\u56de\u590d','assistant-copy',null,'ghost',activeConversation().messages.length?'':'disabled');
 }
 if(menu)(panel.querySelector('[aria-current=true]')||panel.querySelector('button:not([disabled])'))?.focus();
 if(!menu&&restoreFocus&&previous)dock.querySelector(`[data-action="assistant-${previous}"]`).focus();
}
function refreshAssistantConversation(){
 const dock=document.getElementById('assistant-dock');
 const log=dock.querySelector('.assistant-dock-log');
 const input=dock.querySelector('#assistant-dock-input');
 log.innerHTML=assistantLog();
 log.scrollTop=log.scrollHeight;
 input.value=activeConversation().draft;
 dock.querySelector('[type="submit"]').disabled=!input.value.trim();
}
function appendChatTurn(history,text){
 const prompt=text.trim().slice(0,500);
 if(!prompt)return false;
 history.push({role:'user',text:prompt},{role:'assistant',text:sampleReply});

const headlineOrder=loadHeadlineOrder();

function loadHeadlineOrder(){
 const key='vxtpl-preview-home-headline-order-v1';
 const count=homeHeadlines.length;
 try{
  const saved=JSON.parse(localStorage.getItem(key));
  if(Array.isArray(saved)&&saved.length===count&&new Set(saved).size===count&&saved.every(index=>Number.isInteger(index)&&index>=0&&index<count))return saved;
  const order=homeHeadlines.map((_,index)=>index);
  for(let index=count-1;index>0;index--){
   const swap=Math.floor(Math.random()*(index+1));
   [order[index],order[swap]]=[order[swap],order[index]];
  }
  localStorage.setItem(key,JSON.stringify(order));
  return order;
 }catch{
  // Keep the same daily result even when local storage is unavailable.
  return [5,1,8,3,6,0,9,4,7,2];
 }
}
function dailyHeadline(date=new Date()){
 const day=Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000);
 const position=((day%headlineOrder.length)+headlineOrder.length)%headlineOrder.length;
 return homeHeadlines[headlineOrder[position]];
}
function updateHeadlineAtMidnight(){
 const today=new Date();
 const heading=document.getElementById('home-headline');
 if(heading)heading.textContent=dailyHeadline(today);
 const midnight=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1);
 setTimeout(updateHeadlineAtMidnight,midnight-today);
}

function workProgress(work){
 const percent=work.total>0?Math.max(0,Math.min(100,Math.round(work.done/work.total*100))):null;
 const current=work.stages.find(stage=>stage.status==='current');
 const stageStates={done:'\u5df2\u5b8c\u6210',current:'\u5f53\u524d\u9636\u6bb5',pending:'\u672a\u5f00\u59cb'};
 const stageIcons={done:'success',current:'flag',pending:'circle-dashed'};
 const stageState=current?'current':work.stages.every(stage=>stage.status==='done')?'done':'pending';
 const stageLabel=current?current.label+'\u4e2d':stageStates[stageState];
 const stageIcon=current?.icon??stageIcons[stageState];
 const stageItems=work.stages.map(stage=>{
  const label=escapeHtml(stage.label);
  const currentStep=stage.status==='current'?'aria-current="step"':'';
  return `<li class="work-stage" data-state="${stage.status}" ${currentStep} aria-label="${label} \u00b7 ${stageStates[stage.status]}">
    <span class="work-stage-bar" aria-hidden="true"></span>
  </li>`;
 }).join('');
 const percentLabel=percent===null?'\u2014':`${percent}<span class="work-percent-unit">%</span>`;

 return `<div class="work-progress">
  <div class="work-progress-label">
   <span class="work-current-stage">${dsIcon(stageIcon)}${escapeHtml(stageLabel)}</span>
   <strong><span class="sr-only">\u5b8c\u6210\u8fdb\u5ea6 </span>${percentLabel}</strong>
  </div>
  <ol class="work-stages" aria-label="${escapeHtml(work.title)}\u9636\u6bb5\u8fdb\u5ea6">${stageItems}</ol>
 </div>`;
}

function updateDimensions(){app.querySelectorAll('.shell-popover:popover-open').forEach(panel=>positionShellPanel(panel,panel._anchor,Boolean(panel.parentElement.closest('.shell-popover'))));document.getElementById('viewport-size').textContent=`${Math.round(app.clientWidth)} \u00d7 ${Math.round(app.clientHeight)} \u00b7 ${state.theme==='dark'?'\u6df1\u8272':'\u6d45\u8272'}`;}
function isNarrow(){return app.clientWidth<=850;}
function applyPanels(focusPanel=false){
 const workspace=document.getElementById('workspace');if(!workspace)return;
 const left=document.getElementById('left-region'),right=document.getElementById('right-region'),center=document.getElementById('center-region');
 const rightOpen=Boolean(right)&&state.right&&!assistantState.open;
 if(left)left.hidden=!state.left;if(right)right.hidden=!rightOpen;
 workspace.classList.toggle('left-open',state.left);workspace.classList.toggle('right-open',rightOpen);
 workspace.dataset.nav=isNarrow()?'expanded':state.nav;
 if(state.frame==='management')applyManagementNavigation(left);
 const drawers=isNarrow()||(app.clientWidth<=1100&&rightOpen);
 const focusMode=state.focus&&state.frame==='canvas';
 const overlay=drawers&&(state.left&&isNarrow()||rightOpen)&&!focusMode;
 if(center)center.inert=overlay;
 for(const panel of [left,right]){if(!panel)continue;const modal=!panel.hidden&&drawers&&!focusMode&&(panel===right||isNarrow());panel.toggleAttribute('data-drawer',modal);if(modal){panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');}else{panel.removeAttribute('role');panel.removeAttribute('aria-modal');}}

 app.querySelectorAll('[data-action="left"]').forEach(b=>b.setAttribute('aria-pressed',String(state.left)));
 app.querySelectorAll('[data-action="right"]').forEach(b=>b.setAttribute('aria-pressed',String(rightOpen)));
 app.querySelectorAll('[data-action="focus"]').forEach(b=>b.setAttribute('aria-pressed',String(state.focus)));
 if(focusPanel&&overlay){const panel=rightOpen?right:left;panel?.querySelector('button,input,textarea,a')?.focus();}
 renderInspector();
}

 if(assistantState.menu&&!event.target.closest('.assistant-dock-menu,[data-action="assistant-history"],[data-action="assistant-more"]'))setAssistantMenu();
 if(!el||el.disabled)return;
 event.preventDefault();void action(el.dataset.action,el);
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='assistant-dock-input'){
  activeConversation().draft=el.value;
  el.form.querySelector('[type="submit"]').disabled=!el.value.trim();
  return;
 }
 if(el.id==='draft-editor'){state.draft=el.value;state.saved=false;document.getElementById('save-note').textContent='\u5c1a\u672a\u6682\u5b58 \u00b7 \u5185\u5bb9\u4ecd\u4fdd\u7559\u5728\u5f53\u524d\u9875\u9762\u5185\u5b58\u4e2d';}
 if(el.id==='resource-search')filterResources(el.value);
 if(el.id==='project-search'){state.filter=el.value;updateProjectTable();}
 if(el.id==='global-search')document.querySelectorAll('#global-results [data-doc]').forEach(row=>row.hidden=!row.dataset.doc.includes(el.value));
 if(el.id==='map-search-input'){
  const query=el.value.trim().toLowerCase();
  const rows=[...document.querySelectorAll('#map-search-results [data-view-name]')];
  rows.forEach(row=>row.hidden=!row.dataset.viewName.toLowerCase().includes(query));
  document.getElementById('map-search-empty').hidden=rows.some(row=>!row.hidden);
 }
 if(el.id==='product-name'||el.id==='new-project-name')el.setCustomValidity('');
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='page-width'){app.dataset.pageWidth=el.value;updateDimensions();return;}
 if(el.id==='status-select'){state.status=el.value;render();document.getElementById('status-select').focus();}
 if(el.id==='project-status'){state.projectFilter=el.value;updateProjectTable();}
 if(el.id==='project-select-all')setProjectSelection(filteredProjects(),el.checked);
 if(el.hasAttribute('data-project-select'))setProjectSelection([projects[Number(el.dataset.projectSelect)]],el.checked);
 if(el.id==='preset-product'&&el.value!=='custom'){document.getElementById('product-name').value=el.value;document.getElementById('product-tagline').value=({Vxtpl:'\u8ba9\u60f3\u6cd5\u6709\u8d77\u70b9\uff0c\u8ba9\u5de5\u4f5c\u6709\u79e9\u5e8f\u3002',CoSpace:'\u7a7a\u95f4\u5e95\u56fe\u5efa\u4e00\u6b21\uff0c\u5177\u8eab\u667a\u80fd\u4f53\u5171\u7528\u3002',Arda:'\u8fde\u63a5\u77e5\u8bc6\u3001\u8d44\u6599\u4e0e\u56e2\u961f\u7684\u6bcf\u4e00\u6b21\u521b\u4f5c\u3002'})[el.value];document.getElementById('product-eyebrow').value=({Vxtpl:'PRODUCT WORKSPACE',CoSpace:'SPATIAL INTELLIGENCE',Arda:'KNOWLEDGE, CONNECTED'})[el.value];document.getElementById('product-tagline-english').value=({Vxtpl:'ONE WORKSPACE. MORE POSSIBILITIES.',CoSpace:'MAP ONCE. SHARE ACROSS AGENTS.',Arda:'CONNECT KNOWLEDGE. CREATE TOGETHER.'})[el.value];}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='assistant-form'){
  event.preventDefault();
  sendMessage(document.getElementById('assistant-input').value);
 }
 if(event.target.id==='assistant-dock-form'){
  event.preventDefault();
  const conversation=activeConversation();
  if(!appendChatTurn(conversation.messages,conversation.draft))return;
  conversation.draft='';
  refreshAssistantConversation();
  document.getElementById('assistant-dock-input').focus();
 }
});
document.addEventListener('keydown',event=>{
 if(app.querySelector('.shell-popover:popover-open'))return;
 if(app.querySelector('dialog[open]'))return;
 if(event.defaultPrevented||event.isComposing||event.keyCode===229)return;
 const source=event.target;
 if(!(source instanceof Element))return;
 if(event.key==='Enter'&&!event.shiftKey&&!event.altKey&&source instanceof HTMLTextAreaElement&&source.matches('#assistant-input,#assistant-dock-input')){
  event.preventDefault();
  if(!event.repeat&&source.value.trim())source.form?.requestSubmit();
  return;
 }
 const escape=event.key==='Escape'&&!event.shiftKey&&!event.altKey&&!event.ctrlKey&&!event.metaKey;
 if(escape&&source.closest('#chat-log')){
  event.preventDefault();
  document.getElementById('assistant-input')?.focus();
  return;
 }
 if(escape&&assistantState.open&&source.closest('#assistant-dock')){
  event.preventDefault();
  if(event.repeat)return;
  if(assistantState.menu)setAssistantMenu(null,true);
  else toggleAssistantDock(null,false);
  return;
 }
 if(escape){if(state.focus){state.focus=false;applyPanels();mapFocusControl()?.focus();}else if(app.querySelector('[data-drawer]')){const mapTrigger=state.right?'.map-view-info':'.map-view-picker';state.left=!isNarrow()&&state.frame==='management';state.right=false;applyPanels();(app.querySelector(mapTrigger)||app.querySelector('.product-header button'))?.focus();}return;}
 if(event.key==='Tab'){const drawer=app.querySelector('.assistant-dock[data-drawer]')||app.querySelector('[data-drawer]');if(!drawer)return;const items=[...drawer.querySelectorAll('button:not(:disabled),input,textarea,a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||!drawer.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!drawer.contains(document.activeElement))){event.preventDefault();first.focus();}}
});
document.addEventListener('fullscreenchange',()=>{app.querySelectorAll('[data-action="fullscreen"]').forEach(el=>{el.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));if(el.dataset.iconSource==='ds')el.innerHTML=dsIcon(document.fullscreenElement?'minimize':'maximize');});updateDimensions();});
const resizeObserver=new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(isNarrow()&&state.left&&state.right)state.right=false;applyPanels();applyAssistantDock();updateDimensions();});});
resizeObserver.observe(app);
window.addEventListener('hashchange',()=>{
 const [frame,mode]=location.hash.slice(1).split('/');
 if(!frames.some(f=>f[0]===frame)||(frame===state.frame&&(frame!=='home'||mode===state.home)))return;
 const fromPageLink=document.activeElement?.matches('.header-nav a, a[href^="#home/"]');
 if(state.frame==='business')draftByDoc.set(state.doc,state.draft);
 assistantState.open=false;assistantState.menu=null;
 state.frame=frame;
 if(frame==='home'&&homeViews.includes(mode))state.home=mode;
 state.left=!isNarrow()&&['business','management'].includes(frame);
 state.right=frame==='business'&&app.clientWidth>1100;
 state.focus=false;
 render();
 if(fromPageLink)document.getElementById('page-content').focus();
});
if(state.frame==='management')state.right=false;
if(state.frame==='canvas'){state.left=false;state.right=false;}
if(isNarrow()){state.left=false;state.right=false;}
render();
updateHeadlineAtMidnight();
</script>
</body>
</html>

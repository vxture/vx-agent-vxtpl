# vxtpl.vxture.com - app (prod). REFERENCE ARTIFACT, not an install source.
#
# 2026-09-24: this file is **not** what serves vxtpl.vxture.com any more, and this
# header used to claim it was ("must stay byte-identical to what is installed").
# The vxture platform generates every agent vhost itself - one wildcard
# `*.vxture.com` server block (`agents.vhost.template`) plus an upstream map
# generated from the product registry. The live row is
#
#     vxtpl.vxture.com <worker-02-tailnet-ip>:4000;   # worker-02 tailnet IP : APP_PUBLISH_PORT
#
# and the only thing this product controls is the field that produces it
# ("边缘上游" on the product page in opera). There is no file to copy and no
# nginx-sync step: the platform's `20-sync-nginx-config.sh` clears and re-renders
# `sites-enabled` on every deploy, so a hand-installed copy would not survive one.
#
# Kept because (a) `scripts/init/rename-product.mjs` renames it for a product
# copied from this template, and the `$upstream` line below is where that copy is
# forced to confront that it needs its own port allocation; (b) it documents the
# response shape an edge is expected to produce (timeouts, forwarded headers, the
# 404 on the internal-only usage-flush endpoint) for anyone running this app behind
# an edge that is NOT the vxture platform. See configs/edge/README.md.
#
# CUTTING OVER a port is still one change in two places - they just are not the two
# places this header used to name: `APP_PUBLISH_PORT` on the deploy host, and the
# catalog's edge-upstream field. Same window; the last port move left the edge
# pointing at the old number and the site answered 502 until someone noticed
# (liaison letter 50).

server {
    listen 80;
    listen [::]:80;
    server_name vxtpl.vxture.com;
    return 301 https://vxtpl.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vxtpl.vxture.com;

    # Shared *.vxture.com wildcard cert (same as console/accounts).
    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    # Upstream = deploy host over tailscale.
    #
    # **The IP form is what is actually in effect on the vxture platform edge.**
    # This line used to carry the MagicDNS name with the IP only as a fallback
    # suggestion in a comment; that had it backwards. The platform's generated map
    # resolves this host to `<worker-02-tailnet-ip>:4000` (worker-02's tailnet IP), because
    # the edge nginx container resolves Docker DNS and cannot be relied on to reach
    # tailscale MagicDNS (100.100.100.100).
    #
    # Behind a non-vxture edge that CAN reach MagicDNS, "vx-worker-02:4000" is the
    # nicer form - it survives a tailnet IP change. On the vxture platform edge the
    # IP is the operative value and lives in the product catalog, not here.
    #
    # The resolver below stays even though an IP needs none: `proxy_pass` with a
    # **variable** upstream resolves at request time, so switching this line back to
    # the MagicDNS name without a resolver in scope fails at runtime, not at
    # `nginx -t`. Deleting it would hand the next person that trap.
    # **The address below is a placeholder, deliberately.** This repo is public, and
    # a tailnet address (100.64.0.0/10) committed to a public repo identifies a host
    # that the wildcard cert otherwise keeps anonymous. The platform repo enforces
    # exactly this with a guard ("use a placeholder such as <worker-01-tailnet-ip>,
    # or render the address at deploy time from host runtime env"); this file follows
    # the same rule. The operative value lives in the platform's product catalog
    # (see the header), not in git - and since nothing installs this file any more,
    # a placeholder here costs nothing and a real address would cost something.
    resolver 100.100.100.100 valid=30s ipv6=off;   # tailscale MagicDNS (hostname form only)
    set $upstream "<worker-02-tailnet-ip>:4000";   # placeholder : APP_PUBLISH_PORT

    # Internal-only endpoints must NOT be reachable from the public edge. The
    # usage-flush trigger is driven internally on the tailnet; return 404 here.
    # (The app's INTERNAL_JOB_TOKEN guard is the second layer.)
    location = /api/usage/flush { return 404; }

    location / {
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        # nginx defaults to 60s, but a chat turn can legitimately run longer: the
        # app allows Atlas 90s (Atlas itself may retry a fallback model after a
        # 30s upstream timeout) and a Runos capability up to 75s before it. At
        # the default the edge would cut the connection first and the user would
        # see a 504 for a request that was still succeeding.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
    }
}

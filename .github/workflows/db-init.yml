name: db-init

# TWO TIERS (ADR-007): `environment` picks the stack; where it lives and what
# it is called are that Environment's STACK_ROOT / PROJECT_NAME variables
# (database vxturebiz_vxtpl_prod or _beta, container <PROJECT_NAME>-db). The beta Environment has no
# reviewer; the structure gate is still confirm + expected_sha.
#
#   gh workflow run db-init.yml -f environment=beta -f action=apply -f confirm=yes -f expected_sha=<sha>

# The ONLY pipeline allowed to touch DB structure (governance section 6). Manual,
# gated: confirm=yes + expected_sha pin (defeats a floating ref applying stale
# DDL) + the production Environment's required-reviewer approval. The container
# entrypoint never migrates and the regular deploy chain never touches schema;
# every structure change comes through here.
#
#   gh workflow run db-init.yml -f action=apply -f confirm=yes -f expected_sha=<sha>
#
# The DDL applied is the DDL IN THIS CHECKOUT, rsync'd to the host by the job
# into <STACK_ROOT>/db-init/<sha> - never the copy a past deploy left in the
# deploy directory. That is what makes expected_sha mean anything, and the
# increments are counted on both sides so a tree that arrives empty fails
# instead of passing quietly.
#
# EACH FILE APPLIES ONCE (ADR-008). The remote half, deploy/db-init-remote.sh,
# keeps a ledger (vxtpl_meta.applied_ddl): the 00 / 97 / 98 trio on a fresh
# database only, each increment when not yet recorded. A database that predates
# the ledger is bootstrapped once with `bootstrap_through=NNNN`.
#
# `apply` runs the three-part baseline + incr/ increments (idempotent create-once
# + ADD COLUMN IF NOT EXISTS) against the production db container as the DB
# superuser (docker exec, in-container trust), then sets the vxtpl_svc role's
# password from the operator .env's DATABASE_URL so the app can authenticate
# (generating + patching one in place if the URL has none yet). `verify` reports
# schema tables + whether the role has a password, non-destructively.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which stack - each Environment carries its own STACK_ROOT / PROJECT_NAME"
        required: true
        type: choice
        default: production
        options:
          - production
          - beta
      action:
        description: "DDL action"
        required: true
        type: choice
        default: apply
        options:
          - apply
          - verify
      confirm:
        description: "Type 'yes' to confirm a structure change"
        required: true
        type: string
      expected_sha:
        description: "Commit SHA this run must match (version pin)"
        required: true
        type: string
      bootstrap_through:
        description: "ONE-TIME, for a database that predates the ledger (ADR-008): the last increment it already has, e.g. 0003. Leave empty otherwise."
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCT_CODE: vxtpl

jobs:
  db-init:
    name: db-init
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    # INSIDE THE JOB, because an Environment's variables are only in scope for
    # a job that declares the environment. STACK_ROOT / PROJECT_NAME are the
    # Environment's (configuration, not literals) and are REQUIRED.
    env:
      STACK_ROOT: ${{ vars.STACK_ROOT }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      DB_ENV: ${{ inputs.environment == 'beta' && 'beta' || 'prod' }}
    steps:
      - name: Gate on confirm + expected_sha
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "yes" ]; then echo "confirm must be 'yes'" >&2; exit 1; fi
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "expected_sha ($EXPECTED_SHA) != run sha ($ACTUAL_SHA) - refusing" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require the Environment's variables
        shell: bash
        run: |
          set -euo pipefail
          for v in STACK_ROOT PROJECT_NAME; do
            [ -n "${!v:-}" ] || { echo "$v is not set on the '${{ inputs.environment }}' Environment" >&2; exit 1; }
          done
          case "$STACK_ROOT" in /*) ;; *) echo "STACK_ROOT must be absolute: $STACK_ROOT" >&2; exit 1 ;; esac

      - name: Validate secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$TAILSCALE_OAUTH_CLIENT_ID"
          test -n "$TAILSCALE_OAUTH_CLIENT_SECRET"

      - name: Join tailnet and prepare SSH
        uses: ./.github/actions/tailnet-ssh-connect
        with:
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tailscale-tag: ${{ vars.TAILSCALE_OAUTH_CLIENT_TAG }}
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-ssh-passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Apply DDL over SSH
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          PINNED_SHA: ${{ github.sha }}
          BOOTSTRAP_THROUGH: ${{ inputs.bootstrap_through }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          snake="${PRODUCT_CODE//-/_}"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$port" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30)

          # Ship the DDL from THIS checkout - the commit expected_sha pinned.
          #
          # It used to be applied from $REPO_DIR on the host, i.e. from whatever
          # the last SUCCESSFUL deploy happened to rsync there, which made the
          # version pin a promise this job could not keep. That cost a
          # production outage: the 2026-09-01 run went green against a host
          # still carrying v0.1.5, whose incr/ held a README and no .sql, so
          # `shopt -s nullglob` silently applied zero increments, the challenge
          # schema was never created, and every /api/game call 500'd until
          # someone read the log closely enough to notice a missing line.
          # Packing the tree here closes the gap between the pinned commit and
          # the SQL the database actually sees.
          test -d deploy/database/ddl || { echo "no deploy/database/ddl in this checkout" >&2; exit 1; }
          incr_count="$(find deploy/database/ddl/incr -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          echo "[db-init] shipping DDL from ${PINNED_SHA:0:8}: $incr_count increment(s)"
          # To its own directory, keyed by the sha; the running stack's deploy/
          # is never touched, and a structure change does not wait for a release.
          ddl_dir="${STACK_ROOT}/db-init/${PINNED_SHA}"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$ddl_dir/database'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $port -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30" \
            deploy/database/ddl/ "$DEPLOY_USER@$DEPLOY_HOST:$ddl_dir/database/ddl/"

          # THE REMOTE HALF IS A FILE IN THE REPO (deploy/db-init-remote.sh),
          # not a heredoc here, so it can be rehearsed locally with DB_URL=...
          # (ADR-008). It keeps the ledger: each DDL file applies once.
          scp -i ~/.ssh/deploy_key -P "$port" -o ConnectTimeout=30 deploy/db-init-remote.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/db-init.sh"
          printf '%s\n' "REPO_DIR=$(printf %q "$ddl_dir") ENV_FILE=$(printf %q "${STACK_ROOT}/etc/.env") ACTION=$(printf %q "$ACTION") PRODUCT_CODE=$(printf %q "$PRODUCT_CODE") PROJECT_NAME=$(printf %q "$PROJECT_NAME") DB_ENV=$(printf %q "$DB_ENV") SNAKE=$(printf %q "$snake") GIT_SHA=$(printf %q "$PINNED_SHA") EXPECTED_INCR=$(printf %q "$incr_count") BOOTSTRAP_THROUGH=$(printf %q "$BOOTSTRAP_THROUGH") bash /tmp/db-init.sh" \
            | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s
